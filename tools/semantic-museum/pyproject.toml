[project]
name = "lakeql-semantic-museum"
version = "0.1.0"
description = "Reproducible historical-image metadata and embedding release harness"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.39.0,<2",
  "httpx>=0.28.0,<1",
  "numpy>=2.2.0,<3",
  "pillow>=11.3.0,<13",
  "pyarrow>=20.0.0,<23",
  "python-dotenv>=1.1.0,<2",
]

[project.optional-dependencies]
ml = [
  "huggingface-hub>=0.33.0,<2",
  "open-clip-torch>=3.3.0,<4",
  "torch==2.7.1",
  "torchvision==0.22.1",
]
test = [
  "pytest>=8.4.0,<10",
  "pytest-cov>=6.2.0,<8",
  "ruff>=0.12.0,<1",
]

[project.scripts]
semantic-museum = "semantic_museum.cli:main"

[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_museum"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
