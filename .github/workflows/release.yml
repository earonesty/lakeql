name: release

on:
  push:
    tags:
      - "v*"
      - "lakeql@*"
      - "lakeql-*@*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Use npm with trusted publishing support
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Install the software WebGPU adapter
        run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers

      - name: Verify release tag matches package version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            export RELEASE_PACKAGE="lakeql"
            export RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          else
            export RELEASE_PACKAGE="${GITHUB_REF_NAME%@*}"
            export RELEASE_VERSION="${GITHUB_REF_NAME##*@}"
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync } from "node:fs";

          const manifests = readdirSync("packages", { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => `packages/${entry.name}/package.json`)
            .map((path) => ({ path, manifest: JSON.parse(readFileSync(path, "utf8")) }));
          const selected = manifests.find(({ manifest }) => manifest.name === process.env.RELEASE_PACKAGE);
          if (selected === undefined) {
            throw new Error(`Release tag names unknown package ${process.env.RELEASE_PACKAGE}`);
          }
          if (selected.manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(
              `Release tag ${process.env.GITHUB_REF_NAME} does not match ${selected.path} version ${selected.manifest.version}`,
            );
          }
          NODE

      - name: Publish packages
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_ACCESS: public

      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
